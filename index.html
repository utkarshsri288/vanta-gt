<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06070a" />
    <meta name="description" content="VANTA GT — a cinematic, scroll-driven luxury automotive experience. Rotation, doors, interior, engine, specs and acceleration, controlled by your scroll." />
    <meta property="og:title" content="VANTA GT — The Art of Motion" />
    <meta property="og:description" content="An immersive luxury car launch — every angle, controlled by scroll." />
    <title>VANTA GT — The Art of Motion</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #06070a;
        --ink: #f2f4f8;
        --muted: #8a909c;
        --blue: #2e8bff;
        --violet: #7b61ff;
        --red: #ff3b5c;
        --line: rgba(242, 244, 248, 0.12);
        --cyan: #00f0ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: #06070a;
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        cursor: default;
      }
      ::selection { background: var(--blue); color: #06070a; }
      ::-webkit-scrollbar { width: 7px; }
      ::-webkit-scrollbar-track { background: #06070a; }
      ::-webkit-scrollbar-thumb { background: #23262e; border-radius: 99px; }

      /* Custom Interactive Cursor */
      #cursor-dot, #cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 300;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s;
      }
      #cursor-dot {
        width: 6px;
        height: 6px;
        background: #fff;
        box-shadow: 0 0 10px var(--blue);
      }
      #cursor-ring {
        width: 38px;
        height: 38px;
        border: 1.5px solid rgba(46, 139, 255, 0.55);
        transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                    height 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 0.25s,
                    background-color 0.25s,
                    transform 0.08s linear;
      }
      body.hovering #cursor-ring {
        width: 58px;
        height: 58px;
        border-color: var(--violet);
        background: rgba(123, 97, 255, 0.08);
        box-shadow: 0 0 20px rgba(123, 97, 255, 0.4);
      }

      #stage { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #06070a; }
      .car-vid {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.8s ease;
        will-change: opacity, transform;
        filter: contrast(1.06) saturate(1.06);
      }
      .car-vid.ready { opacity: 1; }
      .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(6,7,10,0.7) 0%, rgba(6,7,10,0.05) 18%, rgba(6,7,10,0) 50%, rgba(6,7,10,0.55) 80%, rgba(6,7,10,0.9) 100%),
          linear-gradient(90deg, rgba(6,7,10,0.6) 0%, rgba(6,7,10,0.04) 30%, transparent 50%, rgba(6,7,10,0.04) 70%, rgba(6,7,10,0.6) 100%);
      }
      .mstripe {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        width: 100%;
        z-index: 50;
        transform-origin: left;
        transform: scaleX(0);
        background: linear-gradient(90deg, var(--blue), var(--violet) 55%, var(--red));
        box-shadow: 0 0 16px rgba(123, 97, 255, 0.8);
      }

      /* Stage Rail (Left Navigation Dots) */
      .stage-rail {
        position: fixed;
        left: clamp(16px, 3vw, 36px);
        top: 50%;
        transform: translateY(-50%);
        z-index: 40;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .rail-item {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        opacity: 0.35;
        transition: opacity 0.3s, transform 0.3s;
      }
      .rail-item:hover, .rail-item.active {
        opacity: 1;
        transform: translateX(4px);
      }
      .rail-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
      }
      .rail-item.active .rail-dot {
        background: var(--blue);
        transform: scale(1.6);
        box-shadow: 0 0 10px var(--blue);
      }
      .rail-num {
        font-family: 'Chakra Petch', sans-serif;
        font-size: 10px;
        letter-spacing: 0.16em;
        color: var(--ink);
        display: none;
      }
      .rail-item:hover .rail-num, .rail-item.active .rail-num {
        display: inline-block;
      }
      @media (max-width: 900px) { .stage-rail { display: none; } }

      .mono { font-family: 'Chakra Petch', sans-serif; }
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px clamp(20px, 4vw, 54px);
        transition: background 0.5s, backdrop-filter 0.5s, border-color 0.5s;
        border-bottom: 1px solid transparent;
      }
      nav.solid {
        background: rgba(6, 7, 10, 0.65);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--line);
      }
      .logo {
        font-family: 'Chakra Petch';
        font-weight: 700;
        letter-spacing: 0.26em;
        font-size: 18px;
        text-decoration: none;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .logo .b {
        width: 18px;
        height: 11px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--blue), var(--violet), var(--red));
        box-shadow: 0 0 10px rgba(46, 139, 255, 0.5);
      }
      .navlinks { display: flex; gap: 28px; }
      .navlinks a {
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.3s, text-shadow 0.3s;
        position: relative;
      }
      .navlinks a:hover {
        color: var(--ink);
        text-shadow: 0 0 12px rgba(46, 139, 255, 0.6);
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .sound-toggle {
        font-family: 'Chakra Petch';
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        background: rgba(242, 244, 248, 0.06);
        border: 1px solid var(--line);
        padding: 8px 14px;
        border-radius: 4px;
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sound-toggle:hover, .sound-toggle.active {
        color: var(--ink);
        border-color: var(--blue);
        background: rgba(46, 139, 255, 0.12);
        box-shadow: 0 0 14px rgba(46, 139, 255, 0.3);
      }
      .nav-cta {
        font-family: 'Chakra Petch';
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #06070a;
        background: linear-gradient(110deg, var(--blue), var(--violet));
        text-decoration: none;
        padding: 11px 18px;
        border-radius: 4px;
        font-weight: 600;
        transition: 0.3s;
      }
      .nav-cta:hover {
        box-shadow: 0 0 20px rgba(123, 97, 255, 0.6);
      }
      @media (max-width: 900px) { .navlinks { display: none; } }

      /* Telemetry HUD Cockpit (Bottom Right) */
      .hud {
        position: fixed;
        right: clamp(16px, 4vw, 48px);
        bottom: 24px;
        z-index: 40;
        display: flex;
        align-items: flex-end;
        gap: 20px;
        pointer-events: none;
      }
      .tach-box {
        position: relative;
        width: 72px;
        height: 72px;
      }
      .tach-svg {
        transform: rotate(-135deg);
        width: 100%;
        height: 100%;
      }
      .tach-bg {
        fill: none;
        stroke: rgba(242, 244, 248, 0.12);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 141.37;
        stroke-dashoffset: 0;
      }
      .tach-fill {
        fill: none;
        stroke: url(#tach-grad);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 141.37;
        stroke-dashoffset: 141.37;
        transition: stroke-dashoffset 0.1s linear;
        filter: drop-shadow(0 0 6px rgba(46, 139, 255, 0.8));
      }
      .gear-badge {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Space Grotesk';
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        text-shadow: 0 0 10px var(--blue);
      }
      .gear-sub {
        font-size: 8px;
        font-family: 'Chakra Petch';
        letter-spacing: 0.2em;
        color: var(--muted);
      }
      .hud-text { text-align: right; }
      .hud-text .l {
        font-family: 'Chakra Petch';
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .hud-text .n {
        font-family: 'Space Grotesk';
        font-weight: 700;
        font-size: 26px;
        line-height: 1.1;
        background: linear-gradient(100deg, #fff, var(--blue));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Telemetry Gauge (Bottom Left) */
      .telemetry-left {
        position: fixed;
        left: clamp(16px, 4vw, 48px);
        bottom: 24px;
        z-index: 40;
        pointer-events: none;
        font-family: 'Chakra Petch';
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .telemetry-row { display: flex; align-items: center; gap: 8px; }
      .tele-bar {
        width: 60px;
        height: 3px;
        background: rgba(242, 244, 248, 0.12);
        border-radius: 99px;
        overflow: hidden;
      }
      .tele-bar-fill {
        height: 100%;
        width: 15%;
        background: var(--blue);
        transition: width 0.15s ease-out;
      }

      main { position: relative; z-index: 10; }
      .wrap { width: 100%; max-width: 1320px; margin-inline: auto; padding-inline: clamp(22px, 5vw, 88px); }
      .panel { min-height: 100vh; display: flex; align-items: center; }
      .panel.center { justify-content: center; text-align: center; }
      .panel.right { justify-content: flex-end; text-align: right; }
      .col { max-width: 600px; }
      .kick {
        font-family: 'Chakra Petch';
        font-size: 12px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--blue);
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
      .kick::before {
        content: '';
        width: 26px;
        height: 2px;
        background: linear-gradient(90deg, var(--blue), var(--violet));
        box-shadow: 0 0 8px var(--blue);
      }
      .center .kick { justify-content: center; }
      .right .kick { flex-direction: row-reverse; }
      h1, h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        line-height: 0.96;
        margin: 16px 0 0;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        text-shadow: 0 8px 50px rgba(6, 7, 10, 0.8);
      }
      .hero-h { font-size: clamp(46px, 8.5vw, 128px); }
      .sec-h { font-size: clamp(36px, 6vw, 96px); }
      .grad {
        background: linear-gradient(100deg, #fff 0%, var(--blue) 50%, var(--violet) 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .word { display: inline-block; opacity: 0; transform: translateY(28px); }
      .body {
        margin-top: 20px;
        font-size: clamp(15px, 1.35vw, 18px);
        line-height: 1.65;
        color: rgba(242, 244, 248, 0.82);
        max-width: 46ch;
        text-shadow: 0 2px 22px rgba(6, 7, 10, 0.95);
      }
      .center .body { margin-inline: auto; }
      .right .body { margin-left: auto; }

      /* Magnetic Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 30px;
        padding: 15px 32px;
        border-radius: 4px;
        font-family: 'Chakra Petch';
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        color: #06070a;
        background: linear-gradient(110deg, var(--blue), var(--violet));
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s;
        box-shadow: 0 14px 44px -12px rgba(46, 139, 255, 0.6);
        position: relative;
        overflow: hidden;
      }
      .btn::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(60deg, transparent, rgba(255,255,255,0.2), transparent);
        transform: rotate(25deg) translateY(-100%);
        transition: transform 0.6s ease;
      }
      .btn:hover::after {
        transform: rotate(25deg) translateY(100%);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 56px -12px rgba(123, 97, 255, 0.85);
      }
      .btn.ghost {
        color: var(--ink);
        background: rgba(242, 244, 248, 0.05);
        border: 1px solid var(--line);
        box-shadow: none;
      }
      .btn.ghost:hover {
        background: rgba(242, 244, 248, 0.1);
        border-color: var(--blue);
      }

      /* 3D Interactive Spec Cards */
      .specs {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
        max-width: 760px;
        perspective: 1200px;
      }
      .right .specs { margin-left: auto; }
      .center .specs { margin-inline: auto; }
      @media (max-width: 760px) { .specs { grid-template-columns: 1fr 1fr; } }
      .spec {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px 18px;
        background: rgba(16, 18, 26, 0.38);
        backdrop-filter: blur(12px);
        text-align: left;
        position: relative;
        overflow: hidden;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 0.3s,
                    box-shadow 0.3s;
        transform-style: preserve-3d;
      }
      .spec::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(46, 139, 255, 0.15), transparent 70%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .spec:hover {
        border-color: rgba(46, 139, 255, 0.4);
        box-shadow: 0 16px 40px -10px rgba(46, 139, 255, 0.25);
      }
      .spec:hover::before { opacity: 1; }
      .spec .n {
        font-family: 'Space Grotesk';
        font-weight: 700;
        font-size: clamp(28px, 3.4vw, 42px);
        line-height: 1;
        background: linear-gradient(100deg, #fff, var(--blue));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .spec .u { font-size: 13px; color: var(--blue); font-family: 'Chakra Petch'; letter-spacing: 0.1em; }
      .spec .l { margin-top: 10px; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

      footer {
        position: relative;
        z-index: 10;
        border-top: 1px solid var(--line);
        padding: 38px clamp(20px, 5vw, 80px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        font-family: 'Chakra Petch';
        font-size: 12px;
        letter-spacing: 0.14em;
        color: var(--muted);
      }
      footer .soc { display: flex; gap: 22px; }
      footer a { text-decoration: none; transition: 0.3s; color: var(--muted); }
      footer a:hover { color: var(--blue); }

      #pre {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #06070a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        transition: opacity 0.9s, visibility 0.9s;
      }
      #pre.done { opacity: 0; visibility: hidden; }
      #pre .b { font-family: 'Chakra Petch'; letter-spacing: 0.32em; font-size: 18px; }
      #pre .b span {
        background: linear-gradient(90deg, var(--blue), var(--violet), var(--red));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #pre .track {
        width: min(300px, 62vw);
        height: 2px;
        background: rgba(242, 244, 248, 0.14);
        border-radius: 99px;
        overflow: hidden;
      }
      #pre .fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--blue), var(--violet), var(--red));
        transition: width 0.3s;
      }
      #pre .pct { font-family: 'Chakra Petch'; font-size: 11px; letter-spacing: 0.3em; color: var(--muted); }
    </style>
  </head>

  <body>
    <!-- Interactive Custom Cursor -->
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <!-- Preloader -->
    <div id="pre">
      <div class="b">VANTA <span>GT</span></div>
      <div class="track"><div class="fill" id="pre-fill"></div></div>
      <div class="pct" id="pre-pct">INITIALIZING TELEMETRY · 0%</div>
    </div>

    <!-- 3D Stage Video & FX Canvas -->
    <div id="stage">
      <video class="car-vid" id="car" muted playsinline preload="auto" crossorigin="anonymous" aria-label="Luxury car"></video>
      <canvas class="fx" id="fx"></canvas>
    </div>
    <div class="scrim"></div>
    <div class="mstripe" id="mstripe"></div>

    <!-- Left Stage Rail -->
    <nav class="stage-rail" id="stage-rail">
      <a href="#s1" class="rail-item active" data-sec="0"><span class="rail-dot"></span><span class="rail-num">01 INTRO</span></a>
      <a href="#s2" class="rail-item" data-sec="1"><span class="rail-dot"></span><span class="rail-num">02 DESIGN</span></a>
      <a href="#s3" class="rail-item" data-sec="2"><span class="rail-dot"></span><span class="rail-num">03 ACCESS</span></a>
      <a href="#s4" class="rail-item" data-sec="3"><span class="rail-dot"></span><span class="rail-num">04 CABIN</span></a>
      <a href="#s5" class="rail-item" data-sec="4"><span class="rail-dot"></span><span class="rail-num">05 ENGINE</span></a>
      <a href="#s6" class="rail-item" data-sec="5"><span class="rail-dot"></span><span class="rail-num">06 SPECS</span></a>
      <a href="#s7" class="rail-item" data-sec="6"><span class="rail-dot"></span><span class="rail-num">07 LAUNCH</span></a>
      <a href="#s8" class="rail-item" data-sec="7"><span class="rail-dot"></span><span class="rail-num">08 RESERVE</span></a>
    </nav>

    <!-- Top Navigation -->
    <nav id="nav">
      <a href="#top" class="logo"><span class="b"></span>VANTA GT</a>
      <div class="navlinks">
        <a href="#s4">Interior</a>
        <a href="#s5">Engine</a>
        <a href="#s6">Specs</a>
        <a href="#s8">Configure</a>
      </div>
      <div class="nav-right">
        <button class="sound-toggle" id="sound-btn" title="Toggle audio engine">
          <span id="sound-icon">🔈</span> <span id="sound-text">AUDIO</span>
        </button>
        <a href="#s8" class="nav-cta">Configure</a>
      </div>
    </nav>

    <!-- Telemetry HUD Gauges (Bottom Right & Left) -->
    <div class="hud">
      <div class="tach-box">
        <svg class="tach-svg" viewBox="0 0 60 60">
          <defs>
            <linearGradient id="tach-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--blue)" />
              <stop offset="60%" stop-color="var(--violet)" />
              <stop offset="100%" stop-color="var(--red)" />
            </linearGradient>
          </defs>
          <circle class="tach-bg" cx="30" cy="30" r="22.5" />
          <circle class="tach-fill" id="tach-fill" cx="30" cy="30" r="22.5" />
        </svg>
        <div class="gear-badge">
          <span id="gear-val">N</span>
          <span class="gear-sub">GEAR</span>
        </div>
      </div>
      <div class="hud-text">
        <div class="l" id="hud-l">STANDBY</div>
        <div class="n" id="hud-n">VANTA</div>
      </div>
    </div>

    <!-- Live Telemetry Gauges (Bottom Left) -->
    <div class="telemetry-left">
      <div class="telemetry-row">
        <span>THROTTLE</span>
        <div class="tele-bar"><div class="tele-bar-fill" id="tele-throttle"></div></div>
        <span id="throttle-pct">0%</span>
      </div>
      <div class="telemetry-row">
        <span>G-FORCE</span>
        <div class="tele-bar"><div class="tele-bar-fill" id="tele-gforce" style="background:var(--violet)"></div></div>
        <span id="gforce-val">0.0G</span>
      </div>
    </div>

    <main id="top"></main>

    <footer class="mono">
      <span>VANTA-MOTORS.COM &nbsp;·&nbsp; © 2026 VANTA GT</span>
      <span class="soc">
        <a href="#">Instagram</a>
        <a href="#">YouTube</a>
        <a href="#">X</a>
      </span>
    </footer>

    <script>
      const SCENES = [
        { kick:'VANTA GT — Series 01', h:['The art of','@motion.'], hero:true, body:'A machine sculpted by wind and intent. Scroll to begin a launch experience unlike any other.', cta:'Begin the reveal', l:'STANDBY' },
        { kick:'01 — Design', h:['Every angle,','@considered.'], body:'Not a single line is accidental. The form rotates to reveal a silhouette honed in the wind tunnel.', l:'EXTERIOR' },
        { kick:'02 — Access', h:['Step','@inside.'], body:'Frameless doors rise to welcome you into a cabin built around a single idea — the driver.', l:'DOORS' },
        { kick:'03 — Interior', h:['Crafted around','the @driver.'], body:'Hand-stitched leather, machined alloy, and a cockpit that disappears around you at speed.', l:'CABIN' },
        { kick:'04 — Engineering', h:['Engineered','to the @core.'], body:'The powertrain unfolds into its components — every element obsessed over, balanced, and tuned.', l:'POWERTRAIN' },
        { kick:'05 — Specifications', h:['The','@numbers.'], specs:[['617','HP','Max power'],['2.9','s','0–100 km/h'],['305','km/h','Top speed'],['1,580','kg','Kerb weight']], l:'SPECS' },
        { kick:'06 — Performance', h:['@Unleashed.'], body:'Throttle open. The world compresses. Five-hundred-plus horses translate intent into pure velocity.', l:'LAUNCH' },
        { kick:'07 — The VANTA GT', h:['Your move,','@maestro.'], body:'A limited series for a singular few. Configure yours, or arrange a private unveiling.', cta2:true, l:'RESERVE' },
      ];

      const main = document.getElementById('top');
      const splitWords = (lines) => lines.map((l) => {
        const parts = l.split(' ').map((w) => {
          const g = w.charAt(0) === '@';
          const t = g ? w.slice(1) : w;
          return `<span class="word${g ? ' grad' : ''}">${t}</span>`;
        }).join(' ');
        return `<span class="line" style="display:block">${parts}</span>`;
      }).join('');

      SCENES.forEach((s, i) => {
        const sec = document.createElement('section');
        sec.className = 'panel' + (s.align === 'right' ? ' right' : '') + (s.align === 'center' ? ' center' : '');
        sec.id = 's' + (i + 1);
        const hc = s.hero ? 'hero-h' : 'sec-h';
        const specsHTML = s.specs
          ? `<div class="specs" data-r>${s.specs.map((sp) => `
              <div class="spec">
                <div class="n"><span data-count="${sp[0]}">0</span><span class="u">${sp[1]}</span></div>
                <div class="l">${sp[2]}</div>
              </div>`).join('')}</div>`
          : '';

        sec.innerHTML = `
          <div class="wrap">
            <div class="col">
              <span class="kick" data-cipher="${s.kick}">${s.kick}</span>
              <h1 class="${hc}" data-h>${splitWords(s.h)}</h1>
              ${s.body ? `<p class="body" data-r>${s.body}</p>` : ''}
              ${specsHTML}
              ${s.cta ? `<a href="#s2" class="btn magnetic" data-r>${s.cta} &#8595;</a>` : ''}
              ${s.cta2 ? '<div data-r><a href="#" class="btn magnetic">Configure yours &#8599;</a> <a href="mailto:sales@vanta-motors.com" class="btn ghost magnetic">Private unveiling</a></div>' : ''}
              ${s.hero ? '<div class="body" data-r style="margin-top:30px;font-family:Chakra Petch;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)">Scroll to launch &#8595;</div>' : ''}
            </div>
          </div>`;
        main.appendChild(sec);
      });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

    <script>
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const range = (p, a, b) => clamp((p - a) / (b - a));

      const VID = document.getElementById('car');
      const pre = document.getElementById('pre');
      const preFill = document.getElementById('pre-fill');
      const prePct = document.getElementById('pre-pct');
      const SRC = 'car.mp4';
      let started = false;

      function setPct(p) {
        p = Math.max(0, Math.min(100, Math.round(p)));
        preFill.style.width = p + '%';
        prePct.textContent = (p < 100 ? 'PREPARING THE LAUNCH · ' : 'READY · ') + p + '%';
      }

      function go() {
        if (started) return;
        started = true;
        setPct(100);
        VID.classList.add('ready');
        setTimeout(init, 260);
      }

      function startStream() {
        if (VID.src) return;
        VID.src = SRC;
        VID.load();
        VID.addEventListener('canplaythrough', go, { once: true });
        setTimeout(go, 9000);
      }

      if (window.fetch && window.ReadableStream) {
        fetch(SRC)
          .then((res) => {
            if (!res.ok || !res.body) throw 0;
            const total = +res.headers.get('Content-Length') || 0;
            const reader = res.body.getReader();
            const chunks = [];
            let recv = 0;
            (function pump() {
              reader.read().then(({ done, value }) => {
                if (done) {
                  VID.src = URL.createObjectURL(new Blob(chunks, { type: 'video/mp4' }));
                  VID.load();
                  VID.addEventListener('loadeddata', go, { once: true });
                  setTimeout(go, 2500);
                  return;
                }
                chunks.push(value);
                recv += value.length;
                if (total) setPct((recv / total) * 96);
                pump();
              }).catch(startStream);
            })();
          })
          .catch(startStream);
      } else {
        startStream();
      }

      /* Web Audio Synthesizer (Engine Hum & Interaction Sounds) */
      let audioCtx = null;
      let engineOsc = null;
      let engineGain = null;
      let soundEnabled = false;

      function initAudio() {
        if (audioCtx) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          engineOsc = audioCtx.createOscillator();
          engineGain = audioCtx.createGain();

          engineOsc.type = 'sawtooth';
          engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(260, audioCtx.currentTime);

          engineOsc.connect(filter);
          filter.connect(engineGain);
          engineGain.connect(audioCtx.destination);
          engineGain.gain.setValueAtTime(0, audioCtx.currentTime);

          engineOsc.start();
        } catch (e) {
          console.warn('Audio not available:', e);
        }
      }

      function playBlip(freq = 600, duration = 0.08) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }

      const soundBtn = document.getElementById('sound-btn');
      const soundIcon = document.getElementById('sound-icon');
      soundBtn.addEventListener('click', () => {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        soundEnabled = !soundEnabled;
        soundBtn.classList.toggle('active', soundEnabled);
        soundIcon.textContent = soundEnabled ? '🔊' : '🔈';
        if (engineGain) {
          engineGain.gain.setTargetAtTime(soundEnabled ? 0.03 : 0, audioCtx.currentTime, 0.1);
        }
        if (soundEnabled) playBlip(880, 0.1);
      });

      /* Custom Interactive Cursor Logic */
      const dot = document.getElementById('cursor-dot');
      const ring = document.getElementById('cursor-ring');
      let mouseX = innerWidth / 2, mouseY = innerHeight / 2;
      let ringX = mouseX, ringY = mouseY;

      addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
      });

      function cursorLoop() {
        ringX += (mouseX - ringX) * 0.18;
        ringY += (mouseY - ringY) * 0.18;
        ring.style.transform = `translate(${ringX}px, ${ringY}px)`;
        requestAnimationFrame(cursorLoop);
      }
      cursorLoop();

      // Magnetic hover effects
      document.querySelectorAll('a, button, .btn, .spec').forEach((el) => {
        el.addEventListener('mouseenter', () => {
          document.body.classList.add('hovering');
          playBlip(720, 0.05);
        });
        el.addEventListener('mouseleave', () => {
          document.body.classList.remove('hovering');
        });
      });

      // 3D Tilt on Spec Cards
      document.querySelectorAll('.spec').forEach((card) => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const cx = rect.width / 2;
          const cy = rect.height / 2;
          const rotateX = ((y - cy) / cy) * -9;
          const rotateY = ((x - cx) / cx) * 9;

          card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
          card.style.setProperty('--mouse-x', `${(x / rect.width) * 100}%`);
          card.style.setProperty('--mouse-y', `${(y / rect.height) * 100}%`);
        });
        card.addEventListener('mouseleave', () => {
          card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0px)';
        });
      });

      // Cipher Text Decryption Animation
      const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789_#@%';
      function runCipher(el) {
        const orig = el.dataset.cipher || el.textContent;
        let iter = 0;
        const total = orig.length;
        const iv = setInterval(() => {
          el.textContent = orig
            .split('')
            .map((char, index) => {
              if (index < iter) return orig[index];
              return CHARS[Math.floor(Math.random() * CHARS.length)];
            })
            .join('');
          iter += 1.5;
          if (iter >= total) {
            el.textContent = orig;
            clearInterval(iv);
          }
        }, 25);
      }

      /* Dynamic Atmospheric Particles & Hyperspeed Warp Streaks */
      const fx = document.getElementById('fx');
      const fxc = fx.getContext('2d');
      let carP = 0;
      let motes = [];

      function spr() {
        const s = document.createElement('canvas');
        s.width = s.height = 64;
        const c = s.getContext('2d');
        const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0, 'rgba(180,205,255,1)');
        g.addColorStop(1, 'rgba(180,205,255,0)');
        c.fillStyle = g;
        c.fillRect(0, 0, 64, 64);
        return s;
      }
      const sprite = spr();

      function mk() {
        return {
          x: Math.random() * fx.width,
          y: Math.random() * fx.height,
          r: Math.random() * 1.8 + 0.5,
          vx: -(0.4 + Math.random() * 1.8),
          a: 0.04 + Math.random() * 0.08,
          s: Math.random() * 6.28
        };
      }
      function sizeFx() {
        fx.width = innerWidth;
        fx.height = innerHeight;
        motes = Array.from({ length: 80 }, () => mk());
      }
      sizeFx();

      let prog = 0;
      const ease = { p: 0 };
      let lastSeek = -1;
      let currentVelocity = 0;
      let lastProg = 0;

      const navEl = document.getElementById('nav');
      const bar = document.getElementById('mstripe');
      const hudL = document.getElementById('hud-l');
      const hudN = document.getElementById('hud-n');
      const tachFill = document.getElementById('tach-fill');
      const gearVal = document.getElementById('gear-val');
      const teleThrottle = document.getElementById('tele-throttle');
      const throttlePct = document.getElementById('throttle-pct');
      const teleGforce = document.getElementById('tele-gforce');
      const gforceVal = document.getElementById('gforce-val');
      const railItems = document.querySelectorAll('.rail-item');

      function init() {
        pre.classList.add('done');
        const g = window.gsap;
        g.registerPlugin(window.ScrollTrigger);

        try {
          const L = window.Lenis;
          if (typeof L === 'function') {
            const lenis = new L({ duration: 1.25, smoothWheel: true });
            lenis.on('scroll', window.ScrollTrigger.update);
            g.ticker.add((t) => lenis.raf(t * 1000));
            g.ticker.lagSmoothing(0);
          }
        } catch (e) {}

        window.ScrollTrigger.create({
          trigger: document.body,
          start: 'top top',
          end: 'bottom bottom',
          onUpdate: (s) => (prog = s.progress)
        });

        document.querySelectorAll('section.panel').forEach((sec) => {
          const words = sec.querySelectorAll('[data-h] .word');
          const rest = sec.querySelectorAll('[data-r]');
          const kick = sec.querySelector('.kick');
          const col = sec.querySelector('.col');

          g.set([...words, ...rest], { opacity: 0, y: 28 });

          window.ScrollTrigger.create({
            trigger: sec,
            start: 'top 74%',
            once: true,
            onEnter: () => {
              g.to(words, { opacity: 1, y: 0, duration: 0.9, stagger: 0.05, ease: 'power3.out' });
              g.to(rest, { opacity: 1, y: 0, duration: 0.9, stagger: 0.09, delay: 0.18, ease: 'power3.out' });
              if (kick) runCipher(kick);
            }
          });

          window.ScrollTrigger.create({
            trigger: sec,
            start: 'top bottom',
            end: 'bottom top',
            scrub: true,
            onUpdate: (s) => {
              const d = Math.abs(s.progress - 0.5) * 2;
              col.style.opacity = clamp(1.28 - d * 2.55).toFixed(3);
            }
          });
        });

        // Spec counters
        document.querySelectorAll('[data-count]').forEach((el) => {
          window.ScrollTrigger.create({
            trigger: el,
            start: 'top 88%',
            once: true,
            onEnter: () => {
              const raw = el.dataset.count;
              const dec = raw.indexOf('.') > -1;
              const target = parseFloat(raw.replace(/,/g, ''));
              const o = { v: 0 };
              g.to(o, {
                v: target,
                duration: 1.8,
                ease: 'power2.out',
                onUpdate: () => {
                  el.textContent = dec ? o.v.toFixed(1) : Math.round(o.v).toLocaleString();
                }
              });
            }
          });
        });

        renderer();

        // Canvas animation with dynamic speed warping
        (function fxLoop(t) {
          fxc.clearRect(0, 0, fx.width, fx.height);

          const accel = range(carP, 0.55, 0.85);
          const warp = accel * 3.5;
          const dens = 0.5 + accel * 1.8;

          for (const m of motes) {
            m.x += m.vx * (1 + warp * 2.5);
            m.y += Math.sin(t * 0.001 + m.s) * 0.25;

            if (m.x < -20) {
              m.x = fx.width + 20;
              m.y = Math.random() * fx.height;
            }

            const r = m.r * 4;
            fxc.globalAlpha = m.a * clamp(dens * 0.7);

            // Warp stretch effect
            const streakWidth = warp > 0.3 ? r * (1 + warp * 7) : r * 2;
            const streakHeight = warp > 0.3 ? r * 0.8 : r * 2;

            fxc.drawImage(sprite, m.x - streakWidth / 2, m.y - streakHeight / 2, streakWidth, streakHeight);
          }

          fxc.globalAlpha = 1;
          requestAnimationFrame(fxLoop);
        })(0);

        addEventListener('resize', () => {
          sizeFx();
          window.ScrollTrigger.refresh();
        });
      }

      function renderer() {
        ease.p += (prog - ease.p) * 0.1;
        const p = ease.p;
        carP = p;

        currentVelocity = Math.abs(p - lastProg);
        lastProg = p;

        if (VID.duration && !VID.seeking) {
          const target = clamp(p) * VID.duration * 0.999;
          if (Math.abs(lastSeek - target) > 0.042) {
            lastSeek = target;
            try {
              VID.currentTime = target;
            } catch (e) {}
          }
        }

        bar.style.transform = `scaleX(${p})`;
        navEl.classList.toggle('solid', scrollY > 40);

        const si = Math.min(SCENES.length - 1, Math.round(p * (SCENES.length - 1)));
        hudL.textContent = SCENES[si].l;

        // Stage rail highlight
        railItems.forEach((item, idx) => {
          item.classList.toggle('active', idx === si);
        });

        // Speedometer calculation
        let speed = 0;
        let gear = 'N';

        if (p < 0.1) {
          speed = 0;
          gear = 'N';
        } else if (p < 0.6) {
          speed = Math.round(range(p, 0.1, 0.6) * 45);
          gear = 'D1';
        } else {
          speed = Math.round(range(p, 0.6, 0.85) * 305);
          if (speed < 60) gear = 'D2';
          else if (speed < 110) gear = 'D3';
          else if (speed < 170) gear = 'D4';
          else if (speed < 230) gear = 'D6';
          else gear = 'D8';
        }

        hudN.textContent = si >= 5 ? speed + ' KM/H' : 'VANTA';
        gearVal.textContent = gear;

        // Tachometer SVG circle fill (circumference = 141.37)
        const tachPct = speed / 305;
        const dashOffset = 141.37 - (tachPct * 141.37 * 0.75);
        tachFill.style.strokeDashoffset = dashOffset;

        // Telemetry telemetry readings
        const throttle = Math.round(clamp(speed / 305 * 100 + currentVelocity * 400));
        teleThrottle.style.width = `${throttle}%`;
        throttlePct.textContent = `${throttle}%`;

        const gforce = (clamp(speed / 305 * 1.4 + currentVelocity * 5)).toFixed(1);
        teleGforce.style.width = `${clamp(gforce / 1.5 * 100)}%`;
        gforceVal.textContent = `${gforce}G`;

        // Dynamic audio engine pitch
        if (soundEnabled && audioCtx && engineOsc) {
          const freq = 55 + (speed / 305) * 280;
          engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.08);
        }

        requestAnimationFrame(renderer);
      }
    </script>
  </body>
</html>
